<div class="min-h-screen bg-gray-100 px-4 py-8">
  <div class="mx-auto max-w-4xl">

    <!-- Page Header -->
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-800">
        Secure Credentials
      </h1>

      <p class="mt-2 text-gray-600">
        Manage your encrypted credential records securely.
      </p>
    </div>

    <!-- Messages -->
    <div
      *ngIf="successMessage"
      class="mb-4 rounded-lg bg-green-100 px-4 py-3 text-green-700"
    >
      {{ successMessage }}
    </div>

    <div
      *ngIf="errorMessage"
      class="mb-4 rounded-lg bg-red-100 px-4 py-3 text-red-700"
    >
      {{ errorMessage }}
    </div>

    <!-- Add Credential -->
    <div class="mb-6 rounded-xl bg-white p-6 shadow">
      <h2 class="mb-4 text-xl font-semibold text-gray-800">
        Add Credential
      </h2>

      <form (ngSubmit)="addCredential()">

        <label
          for="sensitiveValue"
          class="mb-2 block text-sm font-medium text-gray-700"
        >
          Sensitive Value
        </label>

        <input
          id="sensitiveValue"
          name="sensitiveValue"
          type="password"
          [(ngModel)]="sensitiveValue"
          placeholder="Enter sensitive value"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
        />

        <button
          type="submit"
          [disabled]="loading"
          class="mt-4 rounded-lg bg-blue-600 px-5 py-2.5 font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
        >
          Add Credential
        </button>

      </form>
    </div>

    <!-- Credential List -->
    <div class="rounded-xl bg-white p-6 shadow">

      <h2 class="mb-4 text-xl font-semibold text-gray-800">
        Your Credentials
      </h2>

      <div *ngIf="loading" class="py-4 text-gray-600">
        Loading...
      </div>

      <div
        *ngIf="!loading && credentials.length === 0"
        class="py-4 text-gray-500"
      >
        No credentials found.
      </div>

      <div
        *ngFor="let credential of credentials"
        class="mb-4 rounded-lg border border-gray-200 p-4"
      >

        <!-- Normal View -->
        <div *ngIf="editingId !== credential.id">

          <div class="flex items-center justify-between">

            <div>
              <p class="text-sm text-gray-500">
                Credential ID
              </p>

              <p class="font-semibold text-gray-800">
                {{ credential.id }}
              </p>
            </div>

            <div class="text-right">
              <p class="text-sm text-gray-500">
                Sensitive Value
              </p>

              <p class="font-mono text-gray-800">
                {{ credential.sensitiveValue }}
              </p>
            </div>

          </div>

          <!-- Actions -->
          <div class="mt-4 flex gap-2">

            <button
              type="button"
              (click)="startEdit(credential)"
              class="rounded-lg bg-yellow-500 px-4 py-2 text-sm font-medium text-white hover:bg-yellow-600"
            >
              Update
            </button>

            <button
              type="button"
              (click)="deleteCredential(credential.id)"
              class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700"
            >
              Delete
            </button>

          </div>

        </div>

        <!-- Edit View -->
        <div *ngIf="editingId === credential.id">

          <label
            for="editValue"
            class="mb-2 block text-sm font-medium text-gray-700"
          >
            New Sensitive Value
          </label>

          <input
            id="editValue"
            name="editValue"
            type="password"
            [(ngModel)]="editingValue"
            placeholder="Enter new sensitive value"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:border-blue-500 focus:outline-none"
          />

          <div class="mt-4 flex gap-2">

            <button
              type="button"
              (click)="updateCredential()"
              [disabled]="loading"
              class="rounded-lg bg-green-600 px-4 py-2 text-sm font-medium text-white hover:bg-green-700 disabled:opacity-50"
            >
              Save
            </button>

            <button
              type="button"
              (click)="cancelEdit()"
              class="rounded-lg bg-gray-500 px-4 py-2 text-sm font-medium text-white hover:bg-gray-600"
            >
              Cancel
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>
</div>
